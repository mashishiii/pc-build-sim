<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>自作PC 組み立てシミュレーター</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<style>
:root{--acc:#5eead4;--acc2:#a78bfa;}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;background:#07090d;color:#e6e9ef;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 55% 30%,#1b2333 0%,#0b0e15 55%,#04050a 100%);}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.glass{background:rgba(13,17,25,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 40px rgba(0,0,0,.45);}
#panel{position:fixed;left:calc(24px + env(safe-area-inset-left));top:calc(22px + env(safe-area-inset-top));width:min(450px,calc(100vw - 48px));padding:16px 20px 16px;border-radius:14px;}
.app{font-size:12px;letter-spacing:.1em;color:#8b93a7;display:flex;justify-content:space-between}
.stepno{font-size:13px;font-weight:700;color:var(--acc);margin-top:10px;letter-spacing:.08em}
h1{font-size:24px;margin:2px 0 8px;font-weight:800;letter-spacing:.02em}
.tip{font-size:14px;line-height:1.7;color:#c9cfdb;min-height:48px}
#bar{display:flex;gap:4px;margin-top:14px}
#bar .seg{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;cursor:pointer;position:relative}
#bar .seg:hover{background:rgba(255,255,255,.25)}
#bar .seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));}
#controls{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;}
button{font:inherit;color:#e6e9ef;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14px;white-space:nowrap;transition:background .15s}
button:hover{background:rgba(255,255,255,.15)}
button.main{background:linear-gradient(135deg,#0d9488,#7c3aed);border-color:transparent;min-width:104px;font-weight:700}
.sep{width:1px;height:26px;background:rgba(255,255,255,.12);margin:0 2px}
.speed{display:flex;gap:4px}
.speed button{padding:8px 10px}
.speed button.on{background:rgba(94,234,212,.18);border-color:var(--acc);color:#fff}
#hint{position:fixed;right:22px;bottom:30px;font-size:12px;color:#7d8597;text-align:right;line-height:1.6}
#time{font-variant-numeric:tabular-nums}
#err{display:none;position:fixed;inset:0;z-index:20;background:rgba(5,6,10,.92);align-items:center;justify-content:center;text-align:center;font-size:16px;line-height:1.8;color:#fca5a5;padding:24px}
@media (max-width:820px){#hint{display:none}}
/* スマホ縦向き */
@media (max-width:600px){
  #panel{left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));width:auto;padding:10px 12px 10px;border-radius:12px}
  .app{font-size:10px;letter-spacing:.06em}
  .stepno{font-size:11px;margin-top:4px}
  h1{font-size:18px;margin:1px 0 4px}
  .tip{font-size:12.5px;line-height:1.55;min-height:0}
  #bar{margin-top:8px;gap:3px}
  #bar .seg{height:6px}
  #controls{left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));transform:none;
    display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:6px;padding:8px;border-radius:14px}
  #controls .sep{display:none}
  #controls button{min-height:44px;padding:6px 4px;font-size:14px;touch-action:manipulation}
  #controls button.main{min-width:0}
  #restart{grid-column:1}
  .speed{grid-column:2 / span 2;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
}
/* スマホ横向き（高さが低い） */
@media (max-height:500px) and (min-width:601px){
  #panel{top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));width:300px;padding:8px 12px}
  h1{font-size:17px;margin:0 0 3px}.tip{font-size:12px;line-height:1.45;min-height:0}.stepno{margin-top:3px}
  #controls{bottom:calc(8px + env(safe-area-inset-bottom));padding:6px 8px;gap:6px}
  #controls button{min-height:40px;padding:6px 10px}
}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c" tabindex="0"></canvas>
<div id="panel" class="glass">
  <div class="app"><span>自作PC 組み立てシミュレーター</span><span id="time">0:00 / 1:21</span></div>
  <div class="stepno" id="stepno">STEP 1 / 11</div>
  <h1 id="title">ケース準備</h1>
  <div class="tip" id="tip"></div>
  <div id="bar"></div>
</div>
<div id="controls" class="glass">
  <button id="prev" title="前のステップ (←)">⏮ 前へ</button>
  <button id="play" class="main" title="再生 / 一時停止 (Space)">❚❚ 一時停止</button>
  <button id="next" title="次のステップ (→)">次へ ⏭</button>
  <div class="sep"></div>
  <button id="restart" title="最初から">↻ 最初から</button>
  <div class="sep"></div>
  <div class="speed" id="speed">
    <button data-s="0.5">0.5x</button><button data-s="1" class="on">1x</button><button data-s="2">2x</button>
  </div>
</div>
<div id="hint">ドラッグ：視点回転　ホイール：ズーム　右ドラッグ：移動<br>次のステップで自動カメラに戻ります</div>
<div id="err"></div>
